# Intake card — one per check (FR-001, FR-002). Filled from the user's message of
# 2026-09-25 ("Сеть Петри: места p1…p6, переходы t1…t6, начальная маркировка
# p1=1, p4=1. Может ли она зависнуть?"). The user was not available for questions:
# every value marked "inferred" or "default" is an explicitly labelled default
# assumption, not a confirmation. The net is a bare P/T net with no interpretation,
# so it is treated as a teaching example (workflow.md §2 allows labelled defaults).

system:
  name: "user-net-p1-p6 (P/T net, 6 places, 6 transitions)"
  boundary: "the whole net as given by the user: places p1..p6, transitions t1..t6, initial marking p1=1, p4=1"
  environment: "none — a closed net; the only nondeterminism is the choice of the transition that fires (inferred: no external token sources or sinks were mentioned)"
  excluded: []
  relation_to_implementation: "built from prose (the user's transition list); no implementation behind the net is known — the net IS the object of the question (default assumption)"

state:
  variables:
    - "p1..p6: byte 0..255 (engine default capacity 255; the check itself shows every place stays <= 1), source meaning: number of tokens in the place"
  processes:
    - "places: p1, p2, p3, p4, p5, p6"
    - "transitions: t1 p1->p2; t2 p2,p4->p3; t3 p3->p1,p4; t4 p4->p5; t5 p1,p5->p6; t6 p6->p4,p1 (all arc weights 1, as in the user's text)"
  channels: []
  initial_states: "exactly one marking: p1=1, p4=1, all other places 0 (from the user)"
  observables:
    - "hang: no transition enabled -> engine property kind `deadlock` (generated by the Petri frontend)"
    - "safe: every place <= 1 -> engine invariant `safe` (generated)"
    - "enabledness of t_i: conjunction of `p >= 1` over the input places of t_i -> `reach` properties authored in IR (sanity)"

transitions:
  semantics: "interleaving: one transition fires per step (Holzmann §8.10 conflict rule; petri-nets.md §2 claim 2)"
  atomic_step: "one firing of one transition (remove input tokens, add output tokens, indivisibly) — by definition of a P/T net"
  terminal_states: "a marking with no enabled transition counts as a hang = violation (the user's question is exactly whether such a marking is reachable) — default assumption; there is no notion of a legitimate final marking in the user's text"
  nondeterminism: "the choice among enabled transitions (t1 and t4 are concurrent at the start; t2/t4 conflict over p4; t1/t5 conflict over p1)"

properties:
  - id: P1
    wording: "Может ли она зависнуть? (can the net hang?)"
    class: safety            # a hang is a reachable bad marking; the witness is a finite path
    logic: deadlock
    extension: untimed
    formula: "engine kind `deadlock`: some reachable marking enables no transition"
    atoms: ["enabledness of t1..t6, i.e. p1..p6 > 0 in the transitions' guards"]
    expected_evidence: "finite trace"
    sanity_companion: "P3 (reach_enabled_t1..t6): every transition can be enabled at least once — the net is not degenerate (dead transitions would make a hang trivial)"
  - id: P2
    wording: "(not asked by the user; generated by the Petri frontend) every place holds at most one token — safe net"
    class: safety
    logic: invariant
    extension: untimed
    formula: "p1<=1 && p2<=1 && p3<=1 && p4<=1 && p5<=1 && p6<=1"
    atoms: ["p1..p6"]
    expected_evidence: "finite trace (if violated)"
    sanity_companion: "none needed: an invariant over the marking has no antecedent"
  - id: P3
    wording: "(sanity, authored by the assistant) each transition t1..t6 is enabled in some reachable marking"
    class: reachability
    logic: "reach (six IR properties reach_enabled_t1 .. reach_enabled_t6)"
    extension: untimed
    formula: "reach_enabled_t: AND over input places p of t of (p > 0)"
    atoms: ["p1..p6"]
    expected_evidence: "finite trace (witness)"
    sanity_companion: "is itself the sanity companion of P1"

assumptions:
  scheduler: "any enabled transition may fire; no priorities (default)"
  delivery: "n/a — no channels"
  failures: "none modelled (default)"
  environment_inputs: "none (closed net, default)"
  bounds:
    - "place capacity 255 (engine default; never approached — `safe` is verified, so every place stays <= 1)"
    - "arc weights 1 (from the user's text)"

fairness:
  required: none          # the question is a hang (finite witness); fairness only matters for liveness/LTL, which was not asked
  justification: "a hang is refuted or shown by a finite firing sequence; no infinite path is excluded"
  confirmed_by_user: false   # user not available; default stated in the report

backend:
  engine: mcd 0.1.0-g0 (CLI fallback: the MCP server is not registered in this session; binary /tmp/mcd)
  search_mode: dfs (plus one bfs run for the shortest hang and one --sweep run for the full state count)
  reductions: none

budget:
  time: "60000 ms (CLI default)"
  states: "1000000 (CLI default); pilot run with --budget-states 3 as the mc_estimate stand-in"
  depth: "1000000 (CLI default)"
  memory: "1024 MiB (CLI default)"
  repeats: "5 runs of mcd check (pilot, dfs, bfs, sweep, dfs-timed) + 1 run on the IR with the reach properties"

evidence:
  expected: exhaustive
  goal: "exhaustive result — the user asks a yes/no question about the net; a yes needs a concrete firing sequence, a no needs a complete search (default assumption)"

artefacts:
  may_store_models_and_traces: true   # default assumption: the net is abstract (p1..p6, t1..t6) and contains no business data; everything is stored only in the working directory named by the caller
  contains_secrets_or_personal_data: "no (abstract teaching net)"
