  states: "1 000 000 (default)"
  depth: "1 000 000 (default)"
  memory: "1024 MiB (default)"
  repeats: 1

evidence:
  expected: exhaustive
  goal: "exhaustive result (the user asks whether the requirement holds, not for one bug)"

