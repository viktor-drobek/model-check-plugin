# Intake card — FR-001/FR-002 (assets/intake-card.yaml filled).
# The user was not available for questions, so every field that would normally be
# asked carries an EXPLICITLY LABELLED ASSUMPTION ("ASSUMPTION (not confirmed)").
# None of them is business-critical: the object of the check is the net itself.

system:
  name: "Petri net p1..p6 / t1..t6 (user's net; identical to Holzmann App_C/petrinet1)"
  boundary: "the place/transition net as given: places p1..p6, transitions t1..t6, marking p1=1, p4=1"
  environment: "none — the only nondeterminism is the choice between enabled transitions (interleaving)"
  excluded: ["no real system behind the net was named by the user"]
  relation_to_implementation: >-
    ASSUMPTION (not confirmed): the net IS the object of the check; there is no
    implementation to carry the result to. If the net is a model of something else,
    the transfer argument is missing and nothing below applies to that something else.

state:
  variables:
    - "p1: byte 0..255, tokens in p1, initial 1"
    - "p2: byte 0..255, tokens in p2, initial 0"
    - "p3: byte 0..255, tokens in p3, initial 0"
    - "p4: byte 0..255, tokens in p4, initial 1"
    - "p5: byte 0..255, tokens in p5, initial 0"
    - "p6: byte 0..255, tokens in p6, initial 0"
  processes: ["places p1..p6; transitions t1..t6 lowered into one IR process `init` with a self-loop edge per transition"]
  channels: []
  initial_states: "exactly one: p1=1, p4=1, all other places 0 (as the user gave it)"
  observables:
    - "hang marking: p2 > 0 && p5 > 0 (the dead marking found by the engine)"
    - "per-place token counts, used by the generated `safe` invariant and the authored `reach` properties"

transitions:
  semantics: "interleaving; exactly one transition fires per step (Holzmann §8.10, claim 2: conflict is resolved by choosing one)"
  atomic_step: >-
    one transition firing, indivisible: the input tokens are removed and the output
    tokens added in one step. This is the definition of P/T firing, not a modelling
    choice (petri-nets.md §3; pitfalls.md §6 names `atomic` as correct here).
  terminal_states: >-
    ASSUMPTION (not confirmed): a marking with no enabled transition is NOT an
    acceptable end state — it is exactly what the user calls "зависнуть" (hang).
    The question asked ("может ли она зависнуть?") states this itself.
  nondeterminism: "the choice among simultaneously enabled transitions; no environment, no failures"

properties:
  - id: P1
    wording: "Может ли она зависнуть? (can the net hang?)"
    class: safety
    logic: deadlock                # engine property kind `deadlock`, generated by the Petri frontend
    extension: untimed
    formula: "not a formula (properties-ltl-ctl.md §1); Holzmann §8.10 `hang`"
    atoms: []
    expected_evidence: "finite trace to a marking with no enabled transition"
    sanity_companion: "P3 (the hang marking is reachable), P4 (all six reachable markings), P6 (a run that never hangs exists)"
  - id: P2
    wording: "generated by the frontend, not asked for: is the net safe (1-bounded)?"
    class: safety
    logic: invariant
    extension: untimed
    formula: "p1<=1 && p2<=1 && p3<=1 && p4<=1 && p5<=1 && p6<=1"
    atoms: ["p1..p6"]
    expected_evidence: "none if it holds; a finite trace if a place ever holds 2 tokens"
    sanity_companion: "P4"
  - id: P3
    wording: "sanity: is the hang marking p2=1, p5=1 really reachable?"
    class: reachability
    logic: reach                    # authored in IR (petri-nets.md §4: reach must be authored by hand at this build)
    extension: untimed
    formula: "p1==0 && p2==1 && p3==0 && p4==0 && p5==1 && p6==0"
    atoms: ["p1..p6"]
    expected_evidence: "witness run"
    sanity_companion: "—"
  - id: P4
    wording: "sanity: which markings are reachable at all / can every transition ever fire?"
    class: reachability
    logic: reach (six properties, one per candidate marking)
    extension: untimed
    formula: "exact marking equality for m0..m5"
    atoms: ["p1..p6"]
    expected_evidence: "witness run per marking"
    sanity_companion: "—"
  - id: P5
    wording: "is p2=1,p5=1 the only way to hang?"
    class: reachability
    logic: reach (negative reading: `violated` = unreachable)
    extension: untimed
    formula: "p1==0 && p3==0 && p4==0 && p6==0 && !(p2==1 && p5==1)"
    atoms: ["p1..p6"]
    expected_evidence: "no state satisfies it (complete search)"
    sanity_companion: "P4"
  - id: P6
    wording: "must it hang — is the hang inevitable, or can the net run forever?"
    class: liveness
    logic: LTL
    extension: untimed
    formula: "<> (p2 > 0 && p5 > 0)"
    atoms: ["p2 > 0", "p5 > 0"]
    expected_evidence: "lasso (prefix + loop) if the hang can be avoided forever"
    sanity_companion: "P3 (the hang marking is reachable, so the formula is not vacuous)"
  - id: P7
    wording: "can the net always still come back / is every transition live in Murata's sense? (branching question)"
    class: liveness (branching)
    logic: CTL — `AG EF …`
    extension: untimed
    formula: "AG EF (p1 > 0)"
    atoms: ["p1 > 0"]
    expected_evidence: "tree witness — NOT EXECUTED by this build (G5)"
    sanity_companion: "—"

assumptions:
  scheduler: >-
    ASSUMPTION (not confirmed): any enabled transition may be chosen at any time
    (free choice / demonic nondeterminism). This is the standard P/T reading and it is
    what makes "может ли зависнуть" a question about possibility.
  delivery: "n/a (no channels)"
  failures: "none modelled"
  environment_inputs: "none"
  bounds:
    - "place capacity 255 (schema default); never approached — the search shows no place exceeds 1"

fairness:
  required: "none for P1-P5 (safety/reachability are unaffected by fairness, fairness.md §1)"
  justification: >-
    P6 was run with `none` first (fairness.md §3 step 1). A weak-fairness sensitivity
    run was added only to document that it changes nothing here: the engine's weak
    fairness is PROCESS-level and the whole net is one IR process, so it cannot
    express "no transition is starved". Transition-level fairness is not available.
  confirmed_by_user: false

backend:
  engine: mcd                       # ${TMP_DIR}/mcd, version 0.1.0-g0, CLI (the plugin's MCP server is not registered in this session)
  search_mode: dfs                  # plus one bfs run and one sweep run
  reductions: none                  # the engine has no POR/symmetry (workflow.md node 8): the search is unreduced

budget:
  time: "60000 ms (default)"
  states: "1000000 (default); pilot run at 50"
  depth: "1000000 (default)"
  memory: "1024 MiB (default)"
  repeats: 1

evidence:
  expected: exhaustive
  goal: "exhaustive result (the net is tiny; a complete search was expected and achieved)"

artefacts:
  may_store_models_and_traces: true     # ASSUMPTION (not confirmed): the net is a textbook example with no business data
  contains_secrets_or_personal_data: "no (six places, six transitions, no data)"
