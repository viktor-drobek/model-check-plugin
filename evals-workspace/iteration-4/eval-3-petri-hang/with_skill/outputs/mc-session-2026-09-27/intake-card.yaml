# Intake card (assets/intake-card.yaml), filled for the user's request of 2026-09-27.
# The user was not available for questions; every value marked ASSUMPTION was filled
# by me as an explicitly labelled default for a teaching example, not confirmed by
# the user (SKILL.md step 1; references/workflow.md §2).

system:
  name: "Petri net p1..p6 / t1..t6 (user's wording)"
  boundary: "the net itself: 6 places, 6 transitions, the token game. Nothing else."
  environment: "none — the net is closed; there is no environment input"
  excluded: []
  relation_to_implementation: >
    ASSUMPTION: none. The net IS the object under study; no real system was named,
    so no conformance argument is possible and none is claimed
    (references/counterexamples.md §3, last paragraph).

state:
  variables:
    - "p1..p6: byte, tokens per place, capacity 255 (schema default) — ASSUMPTION: the
       user named no capacity; 255 is the schema default and never binds here because
       `safe` came back verified (no place exceeds 1)"
  processes:
    - "places p1, p2, p3, p4, p5, p6"
  channels: []
  initial_states: "p1 = 1, p4 = 1, all other places 0 (given by the user)"
  observables:
    - "p_i >= 1  → the place holds at least one token"
    - "the hang marking: p1=0, p2=1, p3=0, p4=0, p5=1, p6=0"

transitions:
  semantics: >
    interleaving; one transition fires per step; transitions sharing an input place
    are in conflict and exactly one of them fires (Holzmann §8.10, claim 2;
    references/petri-nets.md §2)
  atomic_step: >
    one firing of one transition — removing the input tokens and adding the output
    tokens is indivisible by the definition of a Petri net (references/pitfalls.md §6
    names this as the one place where `atomic` is correct rather than suspicious)
  terminal_states: >
    ASSUMPTION: a marking with no enabled transition is a HANG, i.e. an error, not a
    legitimate end state. This is the user's own question ("может ли она зависнуть?"),
    so the reading is theirs, not mine.
  nondeterminism: "the choice of which enabled transition fires"

properties:
  - id: P1
    wording: "Может ли она зависнуть?"
    class: safety (reachability of a bad state)
    logic: deadlock
    extension: untimed
    formula: "the frontend's generated `deadlock` property"
    atoms: []
    expected_evidence: finite trace
    sanity_companion: P3

  - id: P2
    wording: "(not asked by the user; generated by the Petri frontend)"
    class: safety
    logic: invariant
    extension: untimed
    formula: "p1<=1 && p2<=1 && p3<=1 && p4<=1 && p5<=1 && p6<=1"
    atoms: [p1, p2, p3, p4, p5, p6]
    expected_evidence: none (invariant)
    sanity_companion: ""

  - id: P3
    wording: "sanity: is the suspected hang marking actually reachable?"
    class: reachability
    logic: reach
    extension: untimed
    formula: "p1==0 && p2==1 && p3==0 && p4==0 && p5==1 && p6==0"
    atoms: [p1, p2, p3, p4, p5, p6]
    expected_evidence: finite witness
    sanity_companion: "is itself the sanity companion of P1"

  - id: P4..P9
    wording: "sanity: is any transition dead (never enabled)?"
    class: reachability
    logic: reach
    extension: untimed
    formula: "for each t: the conjunction of `p >= 1` over the inputs of t"
    atoms: [p1, p2, p3, p4, p5, p6]
    expected_evidence: finite witness
    sanity_companion: ""

  - id: P10
    wording: "can the hang be reached at all? (the possibility reading of the question)"
    class: reachability
    logic: CTL
    extension: untimed
    formula: "EF (p1==0 && p2==1 && p3==0 && p4==0 && p5==1 && p6==0)"
    atoms: [p1, p2, p3, p4, p5, p6]
    expected_evidence: finite witness
    sanity_companion: P3

  - id: P11
    wording: "must it hang? (the inevitability reading of the question)"
    class: liveness
    logic: CTL
    extension: untimed
    formula: "AF (p1==0 && p2==1 && p3==0 && p4==0 && p5==1 && p6==0)"
    atoms: [p1, p2, p3, p4, p5, p6]
    expected_evidence: lasso
    sanity_companion: P10

  - id: P12
    wording: "is the hang still reachable from every reachable marking?"
    class: liveness (branching)
    logic: CTL
    extension: untimed
    formula: "AG EF (p1==0 && p2==1 && p3==0 && p4==0 && p5==1 && p6==0)"
    atoms: [p1, p2, p3, p4, p5, p6]
    expected_evidence: none (universal; justified by the whole graph)
    sanity_companion: P10

assumptions:
  scheduler: >
    ASSUMPTION: any enabled transition may fire; no priority, no scheduling
    guarantee. This is the standard Petri-net semantics the user's notation implies.
  delivery: "n/a — no channels"
  failures: "none"
  environment_inputs: "none"
  bounds:
    - "place capacity 255 (schema default); never reached — `safe` is verified"

fairness:
  required: none
  justification: >
    P1, P2, P3, P4..P9, P10 and P12 need no fairness by construction
    (references/petri-nets.md §4: the hang/live/safe questions and CTL are all
    checked with fairness `none`). P11 (`AF …`) is CTL and CTL is checked without
    fairness in this engine by design — its `violated` therefore says "there exists
    an infinite run that avoids the hang", with no claim about whether a scheduler
    would actually follow it.
  confirmed_by_user: false

backend:
  engine: mcd 0.1.0 (CLI; the MCP server is not registered in this session)
  search_mode: dfs (and a bfs run for comparison)
  reductions: none (unreduced search)

budget:
  time: 60000 ms (CLI default)
  states: 1000000 (CLI default)
  depth: 1000000 (CLI default)
  memory: 1024 MiB (CLI default)
  repeats: 1 (plus a 50-state pilot, a bfs run and a bfs --sweep run)

evidence:
  expected: exhaustive
  goal: exhaustive result

artefacts:
  may_store_models_and_traces: true   # ASSUMPTION: the net is a textbook-style example with no business data
  contains_secrets_or_personal_data: "no"
